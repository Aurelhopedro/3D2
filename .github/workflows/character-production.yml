name: Character Production — MPFB2 + Blender 4.2 LTS (LEGADO)

# NOTA: Este é o workflow legado com MPFB2.
# Para novos runs, usar character-production-v2.yml
# Push desactivado para evitar conflitos — usar workflow_dispatch manualmente.

on:
  workflow_dispatch:

jobs:
  generate-character:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxi6 libxxf86vm1 \
            libxfixes3 libxrender1 libxkbcommon0 libsm6 \
            curl xz-utils unzip python3-pip git

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-4.2.9-linux-x64
          key: blender-4.2.9-linux-x64

      - name: Descarregar Blender 4.2.9 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -L -o blender.tar.xz \
            "https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          rm blender.tar.xz

      - name: Adicionar Blender ao PATH
        run: echo "${{ github.workspace }}/blender-4.2.9-linux-x64" >> $GITHUB_PATH

      - name: Verificar Blender
        run: blender --version

      - name: Cache MPFB2
        id: cache-mpfb2
        uses: actions/cache@v4
        with:
          path: mpfb2
          key: mpfb2-v2
          restore-keys: mpfb2-

      - name: Clonar MPFB2
        if: steps.cache-mpfb2.outputs.cache-hit != 'true'
        run: |
          # Remover directório se existir (evita erro "already exists")
          rm -rf mpfb2
          git clone --depth 1 \
            https://github.com/makehumancommunity/mpfb2.git mpfb2
          echo "MPFB2 commit: $(git -C mpfb2 rev-parse --short HEAD)"

      - name: Empacotar e instalar MPFB2 no Blender
        run: |
          cd mpfb2/src
          zip -r ../../mpfb2.zip mpfb
          echo "ZIP gerado: $(du -sh ../../mpfb2.zip | cut -f1)"
          cd ../..
          blender -b \
            --command extension install-file \
            -r user_default \
            -e "${{ github.workspace }}/mpfb2.zip" 2>&1 | tee /tmp/mpfb2_install.log
          tail -20 /tmp/mpfb2_install.log

      - name: Verificar MPFB2 instalado
        run: |
          blender -b --python-expr "
          import bpy
          addons = list(bpy.context.preferences.addons.keys())
          print('Addons:', addons[:10])
          " 2>&1 | tail -20

      - name: Cache MakeHuman system assets
        id: cache-mh-assets
        uses: actions/cache@v4
        with:
          path: mh_assets
          key: mh-system-assets-v4

      - name: Descarregar MakeHuman system assets
        if: steps.cache-mh-assets.outputs.cache-hit != 'true'
        run: |
          mkdir -p mh_assets
          curl -L --max-time 60 -o mh_assets/makehuman-system-assets.zip \
            "http://download.tuxfamily.org/makehuman/assets/makehuman-system-assets.zip" \
            2>/dev/null && echo "Assets descarregados" \
            || echo "AVISO: assets nao disponiveis"

      - name: Instalar pygltflib
        run: pip install --quiet pygltflib

      - name: Criar diretório de saída
        run: mkdir -p output

      - name: Gerar personagem com Blender
        env:
          OUTPUT_DIR: ${{ github.workspace }}/output
          MPFB2_DIR:  ${{ github.workspace }}/mpfb2
          MH_ASSETS:  ${{ github.workspace }}/mh_assets
        run: |
          blender -b \
            --python scripts/generate_character.py \
            -- \
            --output "${{ github.workspace }}/output" \
            --assets "${{ github.workspace }}/mh_assets" \
            2>&1 | tee output/blender_full.log

          ls -lh output/ 2>/dev/null || echo "(output vazio)"

          if [ ! -f "output/character.glb" ]; then
            echo "ERRO: character.glb NAO FOI CRIADO"
            tail -60 output/blender_full.log
            exit 1
          fi

      - name: Verificar resultados
        if: always()
        run: |
          ls -lh output/ 2>/dev/null || echo "(vazio)"

      - name: Validar GLB com pygltflib
        if: success()
        run: |
          python3 - <<'PYEOF'
          from pygltflib import GLTF2
          glb = GLTF2().load("output/character.glb")
          print(f"Meshes: {len(glb.meshes)} | Skins: {len(glb.skins)} | Mats: {len(glb.materials)}")
          PYEOF

      - name: Upload artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-mpfb2-legado
          path: |
            output/character_preview.png
            output/character.blend
            output/character.glb
            output/character_report.json
            output/blender_full.log
          if-no-files-found: warn
          retention-days: 30
