name: Character Production — MPFB2 + Blender 4.2 LTS

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**'
      - '.github/workflows/character-production.yml'

jobs:
  generate-character:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. DEPENDÊNCIAS SISTEMA ──────────────────────────────────────────
      - name: Instalar dependências headless
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxi6 libxxf86vm1 \
            libxfixes3 libxrender1 libxkbcommon0 libsm6 \
            curl xz-utils unzip python3-pip git

      # ── 2. BLENDER 4.2.9 LTS ────────────────────────────────────────────
      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-4.2.9-linux-x64
          key: blender-4.2.9-linux-x64

      - name: Descarregar Blender 4.2.9 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -L -o blender.tar.xz \
            "https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          rm blender.tar.xz

      - name: Adicionar Blender ao PATH
        run: echo "${{ github.workspace }}/blender-4.2.9-linux-x64" >> $GITHUB_PATH

      - name: Verificar Blender
        run: blender --version

      # ── 3. MPFB2 ────────────────────────────────────────────────────────
      - name: Cache MPFB2
        id: cache-mpfb2
        uses: actions/cache@v4
        with:
          path: mpfb2
          key: mpfb2-v2
          restore-keys: mpfb2-

      - name: Clonar MPFB2
        if: steps.cache-mpfb2.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 \
            https://github.com/makehumancommunity/mpfb2.git mpfb2
          echo "MPFB2 commit: $(git -C mpfb2 rev-parse --short HEAD)"

      - name: Empacotar e instalar MPFB2 no Blender
        run: |
          cd mpfb2/src
          zip -r ../../mpfb2.zip mpfb
          echo "ZIP gerado: $(du -sh ../../mpfb2.zip | cut -f1)"
          cd ../..
          blender -b \
            --command extension install-file \
            -r user_default \
            -e "${{ github.workspace }}/mpfb2.zip" 2>&1 | tee /tmp/mpfb2_install.log
          echo "--- Últimas linhas do log de instalação ---"
          tail -20 /tmp/mpfb2_install.log

      # ── 4. VERIFICAR INSTALAÇÃO DO MPFB2 ────────────────────────────────
      - name: Verificar MPFB2 instalado
        run: |
          blender -b --python-expr "
          import sys
          try:
              import mpfb
              print('MPFB2 importado OK:', mpfb.__file__)
          except ImportError as e:
              print('MPFB2 NAO disponivel como import direto:', e)
          # Verificar via addons
          import bpy
          addons = list(bpy.context.preferences.addons.keys())
          print('Addons ativos:', addons[:10])
          " 2>&1 | tail -20

      # ── 5. MAKEHUMAN SYSTEM ASSETS ──────────────────────────────────────
      - name: Cache MakeHuman system assets
        id: cache-mh-assets
        uses: actions/cache@v4
        with:
          path: mh_assets
          key: mh-system-assets-v4

      - name: Descarregar MakeHuman system assets
        if: steps.cache-mh-assets.outputs.cache-hit != 'true'
        run: |
          mkdir -p mh_assets
          # URL oficial dos assets do MakeHuman Community
          curl -L --max-time 60 -o mh_assets/makehuman-system-assets.zip \
            "http://download.tuxfamily.org/makehuman/assets/makehuman-system-assets.zip" \
            2>/dev/null && echo "Assets descarregados" \
            || echo "AVISO: assets nao disponiveis (continuando sem eles)"
          ls -lh mh_assets/ || true

      # ── 6. INSTALAR pygltflib ────────────────────────────────────────────
      - name: Instalar pygltflib
        run: pip install --quiet pygltflib

      # ── 7. GERAR PERSONAGEM ──────────────────────────────────────────────
      - name: Criar diretório de saída
        run: mkdir -p output

      - name: Gerar personagem com Blender
        env:
          OUTPUT_DIR: ${{ github.workspace }}/output
          MPFB2_DIR:  ${{ github.workspace }}/mpfb2
          MH_ASSETS:  ${{ github.workspace }}/mh_assets
        run: |
          echo "=== A iniciar Blender ==="
          # Redirecionar stdout+stderr para log E para o terminal ao mesmo tempo
          blender -b \
            --python scripts/generate_character.py \
            -- \
            --output "${{ github.workspace }}/output" \
            --assets "${{ github.workspace }}/mh_assets" \
            2>&1 | tee output/blender_full.log
          BLENDER_EXIT=${PIPESTATUS[0]}
          echo "=== Blender terminou com código: $BLENDER_EXIT ==="

          echo ""
          echo "=== Ficheiros produzidos ==="
          ls -lh output/ 2>/dev/null || echo "(output vazio)"

          # Verificar se o GLB foi criado — falhar aqui com log claro
          if [ ! -f "output/character.glb" ]; then
            echo ""
            echo "=== ERRO: character.glb NAO FOI CRIADO ==="
            echo "=== Últimas 60 linhas do log do Blender ==="
            tail -60 output/blender_full.log
            exit 1
          fi

          echo "GLB criado: $(du -sh output/character.glb | cut -f1)"

      # ── 8. VERIFICAR RESULTADOS ──────────────────────────────────────────
      - name: Verificar resultados
        if: always()
        run: |
          echo "=== Ficheiros em output/ ==="
          ls -lh output/ 2>/dev/null || echo "(vazio)"

          if [ -f output/character_report.json ]; then
            echo ""
            echo "=== Relatório ==="
            python3 -c "
          import json
          r = json.load(open('output/character_report.json'))
          print('Status     :', 'OK' if r.get('success') else 'FALHOU')
          print('Blender    :', r.get('blender_version','?'))
          print('Fonte      :', r.get('body_source','?'))
          print('Gerador    :', r.get('generator','?'))
          print('Vértices   :', r.get('vertices','?'))
          print('Materiais  :', r.get('materials','?'))
          print('MPFB2 ativo:', r.get('mpfb2_active','?'))
          print('Ficheiros  :', r.get('output_files',[]))
          if r.get('errors'):   print('Erros:', r['errors'])
          if r.get('warnings'): print('Avisos:', r['warnings'])
          " 2>/dev/null || cat output/character_report.json
          fi

          if [ -f output/blender_full.log ]; then
            echo ""
            echo "=== Erros/avisos no log do Blender ==="
            grep -i "error\|traceback\|exception\|warning\|failed\|not found" \
              output/blender_full.log | head -40 || echo "(nenhum erro encontrado)"
          fi

      # ── 9. VALIDAR GLB ───────────────────────────────────────────────────
      - name: Validar GLB com pygltflib
        if: success()
        run: |
          echo "GLB: $(du -sh output/character.glb | cut -f1)"
          python3 - <<'PYEOF'
          from pygltflib import GLTF2
          glb = GLTF2().load("output/character.glb")
          print(f"Meshes      : {len(glb.meshes)}")
          print(f"Materials   : {len(glb.materials)}")
          print(f"Textures    : {len(glb.textures)}")
          print(f"Nodes       : {len(glb.nodes)}")
          print(f"Skins       : {len(glb.skins)}")
          print(f"Animations  : {len(glb.animations)}")
          print("GLB VALIDO")
          PYEOF

      # ── 10. PUBLICAR ARTEFACTOS ──────────────────────────────────────────
      - name: Upload artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-mpfb2-v1
          path: |
            output/character_preview.png
            output/character.blend
            output/character.glb
            output/character_report.json
            output/blender_full.log
          if-no-files-found: warn
          retention-days: 30
