name: Character Production

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**'
      - '.github/workflows/character-production.yml'

jobs:
  generate-character:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 1. Instalar dependências headless do Blender ──────────────────────
      - name: Install Blender headless system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxi6 libxxf86vm1 \
            libxfixes3 libxrender1 libxkbcommon0 libsm6 \
            curl xz-utils

      # ── 2. Descarregar e instalar Blender 4.2.9 LTS ──────────────────────
      - name: Download Blender 4.2.9 LTS
        run: |
          curl -L -o blender.tar.xz \
            "https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          echo "${{ github.workspace }}/blender-4.2.9-linux-x64" >> $GITHUB_PATH

      - name: Verify Blender
        run: blender --version

      # ── 3. Instalar MPFB2 como extensão Blender ──────────────────────────
      - name: Clone and install MPFB2
        run: |
          git clone --depth 1 https://github.com/makehumancommunity/mpfb2.git
          cd mpfb2/src
          zip -r ../../mpfb.zip mpfb
          cd ../..
          blender -b --command extension install-file -r user_default -e mpfb.zip
          echo "MPFB2 installed."

      # ── 4. Instalar gltf_validator binário nativo (KhronosGroup) ─────────
      - name: Install gltf_validator binary
        run: |
          GLTF_VERSION="2.0.0-dev.3.8"
          curl -L -o gltf_validator.tar.xz \
            "https://github.com/KhronosGroup/glTF-Validator/releases/download/${GLTF_VERSION}/gltf_validator-${GLTF_VERSION}-linux64.tar.xz"
          tar -xf gltf_validator.tar.xz
          sudo mv gltf_validator /usr/local/bin/gltf_validator
          sudo chmod +x /usr/local/bin/gltf_validator
          which gltf_validator

      # ── 5. Criar pasta de saída ───────────────────────────────────────────
      - name: Create output directory
        run: mkdir -p output

      # ── 6. Executar script Python de geração do personagem ───────────────
      - name: Generate medieval character
        run: |
          blender -b --python scripts/generate_character.py -- \
            --output "${{ github.workspace }}/output"
        env:
          BLENDER_USER_EXTENSIONS: "${{ github.workspace }}/blender-4.2.9-linux-x64/4.2/extensions"

      # ── 6b. DEBUG — listar tudo o que está em output/ ────────────────────
      - name: Debug output directory
        run: |
          echo "=== Contents of output/ ==="
          ls -lah output/ || echo "(directory empty or missing)"
          echo "=== PWD ==="
          pwd
          echo "=== Full search for .glb ==="
          find . -name "*.glb" 2>/dev/null || echo "(no .glb found)"
          echo "=== Full content of character_report.json ==="
          find . -name "character_report.json" -exec cat {} \; 2>/dev/null || echo "(no report found)"

      # ── 7. Validar GLB com gltf_validator ─────────────────────────────────
      #
      #  IMPORTANTE: o CLI do gltf_validator NÃO tem flag --output.
      #  O short flag "-o" corresponde a --stdout, não a um caminho de saída.
      #  Por omissão, o relatório é escrito automaticamente como
      #  "<ficheiro>.report.json" ao lado do input. Passar --output faz o
      #  parser de argumentos falhar e imprimir apenas o texto de ajuda,
      #  com exit code 1 — foi exatamente isto que causava as falhas
      #  anteriores, independentemente de o character.glb existir ou não.
      #
      #  O validator também sai com código != 0 quando encontra ERROS reais
      #  no ficheiro (comportamento esperado): não suprimimos isso, pois a
      #  missão exige não declarar sucesso se a validação falhar.
      - name: Validate GLB
        run: |
          GLB="output/character.glb"
          if [ ! -f "$GLB" ]; then
            echo "ERROR: $GLB not found after generation step."
            exit 1
          fi

          set +e
          gltf_validator "$GLB" --all
          VALIDATOR_EXIT=$?
          set -e

          # Relatório é escrito como output/character.glb.report.json por omissão
          if [ -f "${GLB}.report.json" ]; then
            mv "${GLB}.report.json" output/character_validation.json
            echo "Validation report: output/character_validation.json"
          fi

          echo "gltf_validator exit code: $VALIDATOR_EXIT"
          exit $VALIDATOR_EXIT

      # ── 8. Listar ficheiros gerados ───────────────────────────────────────
      - name: List generated files
        run: ls -lh output/

      # ── 9. Publicar artifacts para download ──────────────────────────────
      - name: Upload character artifacts
        uses: actions/upload-artifact@v4
        with:
          name: medieval-character
          path: output/
          retention-days: 30
          if-no-files-found: error
