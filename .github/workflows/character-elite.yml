name: Character Elite — Pipeline Multi-Especialista v2

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '.github/workflows/character-elite.yml'

jobs:
  generate-character:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ══════════════════════════════════════════════════════════════════════
      # FASE 0 — SISTEMA E DEPENDÊNCIAS
      # ══════════════════════════════════════════════════════════════════════
      - name: Instalar dependências do sistema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxi6 libxxf86vm1 \
            libxfixes3 libxrender1 libxkbcommon0 libsm6 \
            curl xz-utils unzip python3-pip git \
            libgles2 mesa-utils
          mkdir -p output /tmp/mh_out /tmp/textures

      - name: Instalar dependências Python
        run: |
          pip install --quiet \
            makehuman-mcp \
            pygltflib \
            Pillow \
            numpy \
            requests

      # ══════════════════════════════════════════════════════════════════════
      # FASE 0.1 — BLENDER 4.2 LTS
      # ══════════════════════════════════════════════════════════════════════
      - name: Cache Blender 4.2.9 LTS
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: blender-4.2.9-linux-x64
          key: blender-4.2.9-linux-x64-v3

      - name: Descarregar Blender 4.2.9 LTS
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          curl -L -o blender.tar.xz \
            "https://download.blender.org/release/Blender4.2/blender-4.2.9-linux-x64.tar.xz"
          tar -xf blender.tar.xz
          rm blender.tar.xz
          echo "Blender: $(du -sh blender-4.2.9-linux-x64 | cut -f1)"

      - name: Adicionar Blender ao PATH
        run: echo "${{ github.workspace }}/blender-4.2.9-linux-x64" >> $GITHUB_PATH

      - name: Verificar Blender
        run: blender --version

      # ══════════════════════════════════════════════════════════════════════
      # FASE 1 — GERAR CORPO HUMANO COM mhcore (HEADLESS, SEM GUI)
      # O mhcore usa o MakeHuman real por baixo — sem OpenGL, sem Qt
      # Gera um OBJ humano completo com cabelo, roupa, esqueleto
      # ══════════════════════════════════════════════════════════════════════
      - name: "FASE 1 — Gerar corpo com mhcore (MakeHuman headless)"
        run: |
          cat > /tmp/generate_human.py << 'PYEOF'
          import mhcore, os, sys

          OUT = "/tmp/mh_out"
          os.makedirs(OUT, exist_ok=True)

          print("[mhcore] A criar personagem feminina...")

          h = mhcore.new_human()

          # ── Macros corporais (0.0 a 1.0) ────────────────────────────────
          h.set_gender(1.0)   # 1.0 = feminino
          h.set_age(0.35)     # adulta jovem (~25 anos)
          h.set_weight(0.45)  # peso médio
          h.set_muscle(0.4)   # músculo moderado
          h.set_height(0.65)  # altura média-alta

          # ── Modificadores de detalhe (dos ~269 disponíveis) ─────────────
          # Rosto
          try: h.apply_modifier("head/head-oval",         0.3)
          except: pass
          try: h.apply_modifier("forehead/forehead-nar",  0.2)
          except: pass
          try: h.apply_modifier("nose/nose-width1",       -0.1)
          except: pass
          try: h.apply_modifier("lips/lips-volume",        0.4)
          except: pass
          try: h.apply_modifier("eyes/eyes-size",          0.2)
          except: pass
          # Corpo
          try: h.apply_modifier("pelvis/pelvis-tone",      0.3)
          except: pass
          try: h.apply_modifier("breast/breast-size",      0.5)
          except: pass
          try: h.apply_modifier("buttocks/buttocks-tone",  0.3)
          except: pass

          # ── Esqueleto ────────────────────────────────────────────────────
          skel = mhcore.data_path("rigs/default.mhskel")
          if os.path.exists(skel):
              h.set_skeleton(skel)
              print("[mhcore] Esqueleto aplicado")
          else:
              print(f"[mhcore] AVISO: esqueleto não encontrado em {skel}")

          # ── Assets: olhos, pele, dentes, sobrancelhas, pestanas ─────────
          for kind in ("eyes", "eyebrows", "eyelashes", "teeth", "tongue"):
              available = h.list_available(kind)
              if available:
                  try:
                      getattr(h, f"equip_{kind}")(available[0])
                      print(f"[mhcore] {kind}: {os.path.basename(available[0])}")
                  except Exception as e:
                      print(f"[mhcore] SKIP {kind}: {e}")

          # ── Cabelo ───────────────────────────────────────────────────────
          hair_list = h.list_available("hair")
          print(f"[mhcore] Cabelos disponíveis: {len(hair_list)}")
          if hair_list:
              # Preferir cabelo longo/médio se disponível
              long_hair = [x for x in hair_list if any(k in x.lower()
                           for k in ("long","medium","ponytail","bun","wavy"))]
              chosen_hair = long_hair[0] if long_hair else hair_list[0]
              try:
                  h.equip_hair(chosen_hair)
                  print(f"[mhcore] Cabelo: {os.path.basename(chosen_hair)}")
              except Exception as e:
                  print(f"[mhcore] SKIP cabelo: {e}")

          # ── Roupa ────────────────────────────────────────────────────────
          clothes_list = h.list_available("clothes")
          print(f"[mhcore] Roupas disponíveis: {len(clothes_list)}")
          # Equipar até 2 peças de roupa
          equipped = 0
          for c in clothes_list[:8]:
              if equipped >= 2:
                  break
              try:
                  h.equip_clothes(c)
                  print(f"[mhcore] Roupa: {os.path.basename(c)}")
                  equipped += 1
              except Exception as e:
                  print(f"[mhcore] SKIP roupa {os.path.basename(c)}: {e}")

          # ── Pele ─────────────────────────────────────────────────────────
          skin_list = h.list_available("skin") if hasattr(h, "list_available") else []
          print(f"[mhcore] Peles disponíveis: {len(skin_list)}")
          if skin_list:
              try:
                  h.set_skin(skin_list[0])
                  print(f"[mhcore] Pele: {os.path.basename(skin_list[0])}")
              except Exception as e:
                  print(f"[mhcore] SKIP pele: {e}")

          # ── Exportar OBJ (Blender-ready) ─────────────────────────────────
          obj_path = os.path.join(OUT, "character.obj")
          h.export(obj_path)
          print(f"[mhcore] Exportado: {obj_path}")
          print(f"[mhcore] Tamanho OBJ: {os.path.getsize(obj_path) // 1024} KB")

          # Verificar se existe MTL junto
          mtl_path = obj_path.replace(".obj", ".mtl")
          if os.path.exists(mtl_path):
              print(f"[mhcore] MTL: {mtl_path} ({os.path.getsize(mtl_path)} bytes)")
          else:
              print("[mhcore] AVISO: MTL não gerado")

          # Listar todos os ficheiros gerados
          print("[mhcore] Ficheiros gerados:")
          for f in sorted(os.listdir(OUT)):
              fpath = os.path.join(OUT, f)
              print(f"  {f} ({os.path.getsize(fpath) // 1024} KB)")

          print("[mhcore] FASE 1 CONCLUÍDA")
          PYEOF

          python3 /tmp/generate_human.py 2>&1 | tee /tmp/phase1.log
          echo "=== Ficheiros após FASE 1 ==="
          ls -lh /tmp/mh_out/ || echo "(vazio)"

      # ══════════════════════════════════════════════════════════════════════
      # FASE 2 — IMPORTAR OBJ NO BLENDER, ADICIONAR RIG, EXPORTAR GLB
      # Aqui o Blender recebe um humano REAL do mhcore e processa-o
      # ══════════════════════════════════════════════════════════════════════
      - name: "FASE 2 — Blender: importar OBJ, rig, materiais PBR, render, GLB"
        run: |
          cat > /tmp/phase2_blender.py << 'PYEOF'
          import bpy, os, sys, json, math, glob

          OBJ_DIR = "/tmp/mh_out"
          OUTPUT  = "/tmp/final_output"
          os.makedirs(OUTPUT, exist_ok=True)

          report = {
              "success": False,
              "blender_version": bpy.app.version_string,
              "phase": "blender_processing",
              "errors": [],
              "warnings": []
          }

          # ── 1. Limpar cena ───────────────────────────────────────────────
          bpy.ops.wm.read_factory_settings(use_empty=True)

          # ── 2. Importar OBJ gerado pelo mhcore ──────────────────────────
          obj_file = os.path.join(OBJ_DIR, "character.obj")
          if not os.path.exists(obj_file):
              report["errors"].append(f"OBJ não encontrado: {obj_file}")
              print(f"[Blender] ERRO: {obj_file} não existe")
              # Listar o que há no directório
              print(f"[Blender] Conteúdo de {OBJ_DIR}:")
              for f in os.listdir(OBJ_DIR):
                  print(f"  {f}")
              with open(os.path.join(OUTPUT, "report.json"), "w") as f:
                  json.dump(report, f, indent=2)
              sys.exit(1)

          print(f"[Blender] A importar: {obj_file}")
          print(f"[Blender] Tamanho: {os.path.getsize(obj_file) // 1024} KB")

          # Importar OBJ — API correcta do Blender 4.x
          bpy.ops.wm.obj_import(
              filepath=obj_file,
              forward_axis='Y',
              up_axis='Z'
          )

          imported_objs = [o for o in bpy.context.selected_objects if o.type == 'MESH']
          print(f"[Blender] Objectos importados: {len(imported_objs)}")
          for o in imported_objs:
              print(f"  - {o.name}: {len(o.data.vertices)} verts, {len(o.data.polygons)} faces")

          if not imported_objs:
              report["errors"].append("Nenhum mesh importado do OBJ")
              with open(os.path.join(OUTPUT, "report.json"), "w") as f:
                  json.dump(report, f, indent=2)
              sys.exit(1)

          # ── 3. Suavizar todos os meshes ──────────────────────────────────
          for obj in imported_objs:
              bpy.context.view_layer.objects.active = obj
              bpy.ops.object.shade_smooth()
              print(f"[Blender] Suavizado: {obj.name}")

          # ── 4. Melhorar materiais PBR ────────────────────────────────────
          # O mhcore já exporta materiais no MTL — aqui melhoramos os nós
          skin_keywords  = ["skin", "body", "face", "head"]
          hair_keywords  = ["hair"]
          cloth_keywords = ["cloth", "shirt", "pants", "jeans", "trouser",
                            "top", "dress", "shoe", "boot"]

          for mat in bpy.data.materials:
              mat.use_nodes = True
              nodes = mat.node_tree.nodes
              links = mat.node_tree.links

              # Encontrar BSDF existente ou criar
              bsdf = nodes.get("Principled BSDF")
              if not bsdf:
                  bsdf = nodes.new("ShaderNodeBsdfPrincipled")
                  out = nodes.get("Material Output") or nodes.new("ShaderNodeOutputMaterial")
                  links.new(bsdf.outputs["BSDF"], out.inputs["Surface"])

              mat_name_lower = mat.name.lower()

              if any(k in mat_name_lower for k in skin_keywords):
                  # Pele: subsurface scattering realista
                  bsdf.inputs["Base Color"].default_value    = (0.80, 0.63, 0.52, 1.0)
                  bsdf.inputs["Subsurface Weight"].default_value = 0.18
                  bsdf.inputs["Subsurface Radius"].default_value = (1.0, 0.2, 0.1)
                  bsdf.inputs["Roughness"].default_value     = 0.55
                  bsdf.inputs["Specular IOR Level"].default_value = 0.3
                  print(f"[Blender] Material pele ajustado: {mat.name}")

              elif any(k in mat_name_lower for k in hair_keywords):
                  # Cabelo: especular e transparência
                  bsdf.inputs["Base Color"].default_value    = (0.07, 0.04, 0.02, 1.0)
                  bsdf.inputs["Roughness"].default_value     = 0.35
                  bsdf.inputs["Specular IOR Level"].default_value = 0.5
                  print(f"[Blender] Material cabelo ajustado: {mat.name}")

              elif any(k in mat_name_lower for k in cloth_keywords):
                  # Roupa: rugosidade têxtil
                  bsdf.inputs["Roughness"].default_value     = 0.82
                  bsdf.inputs["Sheen Weight"].default_value  = 0.25
                  print(f"[Blender] Material roupa ajustado: {mat.name}")

          # ── 5. Encontrar o mesh principal do corpo ───────────────────────
          # O maior mesh é normalmente o corpo base
          body_obj = max(imported_objs, key=lambda o: len(o.data.vertices))
          print(f"[Blender] Corpo principal: {body_obj.name} ({len(body_obj.data.vertices)} verts)")

          # ── 6. Criar armadura (Rigify ou manual) ─────────────────────────
          print("[Blender] A criar armadura...")
          try:
              bpy.ops.preferences.addon_enable(module="rigify")
              # Posicionar metarig na base do personagem
              bpy.ops.object.armature_human_metarig_add()
              arm_obj = bpy.context.active_object
              arm_obj.name = "Armature_Human"

              # Escalar metarig para corresponder ao corpo importado
              # O mhcore exporta em metros (~1.7m)
              bounds = [body_obj.bound_box[i][2] for i in range(8)]
              body_height = max(bounds) - min(bounds)
              print(f"[Blender] Altura do corpo: {body_height:.3f}m")

              # Ajustar escala do metarig
              arm_obj.scale = (body_height / 1.7, body_height / 1.7, body_height / 1.7)
              bpy.ops.object.transform_apply(scale=True)
              print(f"[Blender] Metarig Rigify criado e escalado")
              rig_method = "rigify_metarig"

          except Exception as e:
              print(f"[Blender] Rigify falhou ({e}), criando armadura simples...")
              bpy.ops.object.armature_add(location=(0, 0, 0))
              arm_obj = bpy.context.active_object
              arm_obj.name = "Armature_Human"
              rig_method = "simple_armature"

          # ── 7. Parent: corpo → armadura com pesos automáticos ───────────
          print("[Blender] A aplicar parent com pesos automáticos...")
          try:
              bpy.ops.object.select_all(action='DESELECT')
              for obj in imported_objs:
                  obj.select_set(True)
              arm_obj.select_set(True)
              bpy.context.view_layer.objects.active = arm_obj
              bpy.ops.object.parent_set(type='ARMATURE_AUTO')
              print(f"[Blender] Parent aplicado a {len(imported_objs)} meshes")
          except Exception as e:
              report["warnings"].append(f"Parent falhou: {e}")
              print(f"[Blender] AVISO parent: {e}")

          # ── 8. Câmara e Iluminação ───────────────────────────────────────
          print("[Blender] A configurar cena...")

          # Câmara de retrato
          cam_data = bpy.data.cameras.new("Camera")
          cam_data.lens = 85
          cam_obj = bpy.data.objects.new("Camera", cam_data)
          bpy.context.collection.objects.link(cam_obj)
          cam_obj.location = (0, -2.5, 1.2)
          cam_obj.rotation_euler = (math.radians(90), 0, 0)
          bpy.context.scene.camera = cam_obj

          # Three-point lighting
          def add_area_light(name, loc, energy, color=(1,1,1), size=1.5):
              d = bpy.data.lights.new(name, 'AREA')
              d.energy = energy
              d.color  = color
              d.size   = size
              o = bpy.data.objects.new(name, d)
              bpy.context.collection.objects.link(o)
              o.location = loc
              return o

          add_area_light("KeyLight",  (-1.5, -2.0, 2.5), 1500, (1.00, 0.95, 0.85))
          add_area_light("FillLight", ( 2.0, -1.5, 1.8),  600, (0.85, 0.90, 1.00))
          add_area_light("RimLight",  ( 0.0,  2.5, 2.5),  800, (1.00, 0.98, 0.95))

          # ── 9. Render ────────────────────────────────────────────────────
          scene = bpy.context.scene
          scene.render.engine              = 'BLENDER_WORKBENCH'
          scene.render.resolution_x        = 1024
          scene.render.resolution_y        = 1024
          scene.render.resolution_percentage = 100
          scene.display.shading.light      = 'STUDIO'
          scene.display.shading.color_type = 'MATERIAL'
          scene.display.shading.show_specular_highlight = True
          scene.render.image_settings.file_format = 'PNG'
          preview_path = os.path.join(OUTPUT, "character_preview.png")
          scene.render.filepath = preview_path

          print("[Blender] A renderizar...")
          bpy.ops.render.render(write_still=True)
          if os.path.exists(preview_path):
              print(f"[Blender] Preview: {os.path.getsize(preview_path) // 1024} KB")
          else:
              print("[Blender] AVISO: preview não gerado")
              report["warnings"].append("Preview não gerado")

          # ── 10. Guardar .blend ───────────────────────────────────────────
          blend_path = os.path.join(OUTPUT, "character.blend")
          bpy.ops.wm.save_as_mainfile(filepath=blend_path)
          print(f"[Blender] Blend guardado: {os.path.getsize(blend_path) // 1024} KB")

          # ── 11. Exportar GLB ─────────────────────────────────────────────
          glb_path = os.path.join(OUTPUT, "character.glb")
          print("[Blender] A exportar GLB...")
          try:
              bpy.ops.export_scene.gltf(
                  filepath=glb_path,
                  export_format='GLB',
                  export_apply=True,
                  export_animations=True,
                  export_skins=True,
                  export_morph=True,
                  export_lights=False,
                  export_cameras=False,
                  use_selection=False,
              )
              glb_size = os.path.getsize(glb_path) if os.path.exists(glb_path) else 0
              print(f"[Blender] GLB: {glb_size // 1024} KB")
          except Exception as e:
              report["errors"].append(f"GLB export: {e}")
              print(f"[Blender] ERRO GLB: {e}")
              # Tentar exportação mínima
              try:
                  bpy.ops.export_scene.gltf(filepath=glb_path, export_format='GLB')
                  print("[Blender] GLB (fallback) exportado")
              except Exception as e2:
                  print(f"[Blender] GLB fallback falhou: {e2}")

          # ── 12. Relatório final ──────────────────────────────────────────
          all_meshes    = [o for o in bpy.data.objects if o.type == 'MESH']
          all_armatures = [o for o in bpy.data.objects if o.type == 'ARMATURE']
          total_verts   = sum(len(m.data.vertices) for m in all_meshes)
          total_mats    = len(bpy.data.materials)

          report.update({
              "success":         os.path.exists(glb_path),
              "blender_version": bpy.app.version_string,
              "rig_method":      rig_method,
              "total_meshes":    len(all_meshes),
              "total_vertices":  total_verts,
              "total_materials": total_mats,
              "armatures":       len(all_armatures),
              "glb_kb":          os.path.getsize(glb_path) // 1024 if os.path.exists(glb_path) else 0,
              "output_files": [
                  "character_preview.png",
                  "character.blend",
                  "character.glb",
                  "character_report.json"
              ],
              "pipeline": "Elite Multi-Specialist v2 — mhcore + Blender 4.2 LTS",
              "body_source": "MakeHuman (mhcore headless — CC0 output)",
              "license": "CC0 — Output is commercial-use free"
          })

          with open(os.path.join(OUTPUT, "character_report.json"), "w") as f:
              json.dump(report, f, indent=2)

          print(f"\n[Blender] ═══ PIPELINE CONCLUÍDO ═══")
          print(f"  Meshes:    {len(all_meshes)}")
          print(f"  Vértices:  {total_verts:,}")
          print(f"  Materiais: {total_mats}")
          print(f"  Armatures: {len(all_armatures)}")
          print(f"  GLB: {'✅ OK' if os.path.exists(glb_path) else '❌ FALHOU'}")
          PYEOF

          blender -b \
            --python /tmp/phase2_blender.py \
          2>&1 | tee /tmp/phase2.log
          echo "=== Ficheiros finais ==="
          ls -lh /tmp/final_output/ 2>/dev/null || echo "(vazio)"

      # ══════════════════════════════════════════════════════════════════════
      # RECOLHER RESULTADOS
      # ══════════════════════════════════════════════════════════════════════
      - name: Copiar resultados para output/
        if: always()
        run: |
          cp -f /tmp/final_output/character* output/ 2>/dev/null || true
          cp -f /tmp/phase1.log output/phase1_mhcore.log 2>/dev/null || true
          cp -f /tmp/phase2.log output/phase2_blender.log 2>/dev/null || true
          echo "=== output/ ==="
          ls -lh output/ || true

      - name: Verificar GLB
        if: always()
        run: |
          if [ -f output/character.glb ]; then
            echo "✅ GLB criado: $(du -sh output/character.glb | cut -f1)"
            python3 - << 'PYEOF'
          from pygltflib import GLTF2
          g = GLTF2().load("output/character.glb")
          print(f"  Meshes:     {len(g.meshes)}")
          print(f"  Materials:  {len(g.materials)}")
          print(f"  Textures:   {len(g.textures)}")
          print(f"  Nodes:      {len(g.nodes)}")
          print(f"  Skins:      {len(g.skins)}")
          print(f"  Animations: {len(g.animations)}")
          print("  GLB VÁLIDO ✅")
          PYEOF
          else
            echo "❌ GLB não encontrado"
            echo "=== Últimas 50 linhas phase2 ==="
            tail -50 /tmp/phase2.log 2>/dev/null || true
          fi

          if [ -f output/character_report.json ]; then
            echo "=== Relatório ==="
            python3 -c "
          import json
          r = json.load(open('output/character_report.json'))
          for k,v in r.items():
            if k not in ('errors','warnings','output_files'):
              print(f'  {k}: {v}')
          if r.get('errors'):   print('ERROS:', r['errors'])
          if r.get('warnings'): print('AVISOS:', r['warnings'])
          " 2>/dev/null || cat output/character_report.json
          fi

      # ══════════════════════════════════════════════════════════════════════
      # PUBLICAR ARTEFACTOS
      # ══════════════════════════════════════════════════════════════════════
      - name: Upload artefactos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: character-elite-v2
          path: |
            output/character_preview.png
            output/character.blend
            output/character.glb
            output/character_report.json
            output/phase1_mhcore.log
            output/phase2_blender.log
          if-no-files-found: warn
          retention-days: 30
